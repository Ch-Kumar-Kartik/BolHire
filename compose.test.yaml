name: bolhire-db-test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bolhire_test
      POSTGRES_USER: bolhire_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set a disposable local test password}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolhire_test -d bolhire_test"]
      interval: 1s
      timeout: 3s
      retries: 30
